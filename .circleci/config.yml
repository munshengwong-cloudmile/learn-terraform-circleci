version: 2.1

orbs:
  terraform: circleci/terraform@3.7.0

workflows:
  deploy_infrastructure:
    jobs:
      # format to ensure codebase redability
      - terraform/fmt:
          checkout: true

      # check syntax and validate the configuration files
      - terraform/validate:
          checkout: true
          requires:
            - terraform/fmt

      # generates the speculative execution plan
      - terraform/plan:
          checkout: true
          persist-workspace: true # saves the plan file for the apply step
          requires:
            - terraform/validate

      # manual approval
      - hold-for-approval:
          type: approval
          requires:
            - terraform/plan
          filters:
            branches:
              only: main # only require approval on the main branch

      # executes the saved plan after approval
      - terraform/apply:
          attach-workspace: true
          context: terraform-env
          requires:
            - hold-for-approval
          filters:
            branches:
              only: main